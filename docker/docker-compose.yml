name: kiro-gateway

services:
  kiro-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kiro-gateway
    ports:
      - "8000:8000"
    volumes:
      - ~/Library/Application Support/kiro-cli:/home/kiro/.local/share/kiro-cli:ro
      - ./start_no_ssl_verify.py:/app/start_no_ssl_verify.py:ro
    command: ["python", "start_no_ssl_verify.py"]
    env_file:
      - ../.env
    environment:
      - KIRO_CLI_DB_FILE=/home/kiro/.local/share/kiro-cli/data.sqlite3
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
